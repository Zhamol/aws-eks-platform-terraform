image: ubuntu:22.04

variables:
  # Set AWS_ROLE_ARN in GitLab CI project settings to avoid hardcoding account IDs
  AWS_ROLE_ARN: "arn:aws:iam::940920597829:role/gitlab-ci-terraform"
  AWS_DEFAULT_REGION: "us-east-1"
  TERRAFORM_VERSION: "1.9.0"
  AWS_CLI_VERSION: "2.15.0"
  DEV_ACCOUNT_ID: "446598504905"
  STAGING_ACCOUNT_ID: "916292310732"
  DEV_STATE_BUCKET: "terraform-state-${DEV_ACCOUNT_ID}"
  STAGING_STATE_BUCKET: "terraform-state-${STAGING_ACCOUNT_ID}"
  STATE_LOCK_TABLE: "terraform-state-lock"
  DEV_EKS_PUBLIC_ACCESS_CIDRS: '["96.237.136.160/32"]'
  DEV_KUBERNETES_VERSION: "1.33"
  # STAGING_EKS_PUBLIC_ACCESS_CIDRS / STAGING_KUBERNETES_VERSION: set before re-enabling staging jobs below

# Dedupe pipelines: an MR gets exactly one pipeline (merge_request_event),
# a push to main gets exactly one pipeline (push) — no parallel branch +
# MR pipeline racing against the same dev state/lock.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"

stages:
  - validate
  - test
  - plan-dev
  - apply-dev
  - notify-dev
  # - plan-staging
  # - apply-staging
  # - notify-final


# Combined template — OIDC + install
# step 1 — request OIDC token from GitLab

.base: &base
   id_tokens:
      GITLAB_OIDC_TOKEN:
        aud: sts.amazonaws.com
   before_script:

    # step 2 — install AWS CLI

     - apt-get update -qq && apt-get install -y -qq curl unzip
     - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip" -o awscliv2.zip
     - unzip -q awscliv2.zip && ./aws/install

     # step 3 — install Terraform with SHA256 checksum verification
     - curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS" -o terraform_SHA256SUMS
     - curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip
     - sha256sum -c <(grep "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" terraform_SHA256SUMS)
     - unzip -q terraform_${TERRAFORM_VERSION}_linux_amd64.zip && mv terraform /usr/local/bin/

     # step 4 — authenticate with AWS via OIDC
     - >
       export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
       $(aws sts assume-role-with-web-identity
       --role-arn ${AWS_ROLE_ARN}
       --role-session-name "gitlab-ci-${CI_JOB_ID}"
       --web-identity-token "${GITLAB_OIDC_TOKEN}"
       --duration-seconds 3600
       --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
       --output text))

validate:
  stage: validate
  <<: *base
  script:
    # check formatting
    - terraform fmt --check -recursive

    # check syntax for dev
    - cd environments/dev
    - terraform init -backend=false
    - terraform validate

    # STAGING DISABLED  — ENABLE when ready to DEPLOY STAGING
    # - cd ${CI_PROJECT_DIR}/environments/staging
    # - terraform init -backend=false
    # - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  <<: *base
  script:
    # install tflint
    - curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/v0.55.0/tflint_linux_amd64.zip" -o tflint.zip
    - unzip -q tflint.zip && mv tflint /usr/local/bin/
    - tflint --version
    - tflint --init --config $(pwd)/.tflint.hcl

    # run tflint on terraform directories
    - tflint --chdir=environments/dev --config $(pwd)/.tflint.hcl
    - tflint --chdir=environments/staging --config $(pwd)/.tflint.hcl
    - tflint --chdir=modules/vpc --config $(pwd)/.tflint.hcl
    - tflint --chdir=modules/ec2 --config $(pwd)/.tflint.hcl
    - tflint --chdir=modules/s3 --config $(pwd)/.tflint.hcl
    - tflint --chdir=modules/eks --config $(pwd)/.tflint.hcl  # ← added eks module
    - tflint --chdir=bootstrap --config $(pwd)/.tflint.hcl

    # install and run checkov
    - apt-get install -y -qq python3-pip
    - pip3 install checkov
    - checkov -d environments/ --quiet --config-file $(pwd)/.checkov.yaml
    - checkov -d modules/ --quiet --config-file $(pwd)/.checkov.yaml
    - checkov -d bootstrap/ --quiet --config-file $(pwd)/.checkov.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

plan-dev:
  stage: plan-dev
  <<: *base
  script:
    - export TF_VAR_account_id=$DEV_ACCOUNT_ID
    - export TF_VAR_public_access_cidrs=$DEV_EKS_PUBLIC_ACCESS_CIDRS
    - export TF_VAR_kubernetes_version=$DEV_KUBERNETES_VERSION
    - cd environments/dev
    - terraform init
        -backend-config="bucket=${DEV_STATE_BUCKET}"
        -backend-config="dynamodb_table=${STATE_LOCK_TABLE}"
        -backend-config="region=${AWS_DEFAULT_REGION}"
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - environments/dev/tfplan
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - environments/dev/**/*
        - modules/**/*
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - environments/dev/**/*
        - modules/**/*

apply-dev:
  stage: apply-dev
  <<: *base
  script:
    - export TF_VAR_account_id=$DEV_ACCOUNT_ID
    - export TF_VAR_public_access_cidrs=$DEV_EKS_PUBLIC_ACCESS_CIDRS
    - export TF_VAR_kubernetes_version=$DEV_KUBERNETES_VERSION
    - cd environments/dev
    - terraform init
        -backend-config="bucket=${DEV_STATE_BUCKET}"
        -backend-config="dynamodb_table=${STATE_LOCK_TABLE}"
        -backend-config="region=${AWS_DEFAULT_REGION}"
    - terraform apply tfplan
  needs: ["plan-dev"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - environments/dev/**/*
        - modules/**/*
        - .gitlab-ci.yml
      when: on_success


notify-dev:
  stage: notify-dev
  image: curlimages/curl:latest
  before_script: []
  script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        STATUS="❌ Dev deployment failed"
        COLOR="danger"
      else
        STATUS="✅ Dev deployed successfully"
        COLOR="good"
      fi
      curl -s -X POST $SLACK_WEBHOOK_URL \
        -H 'Content-type: application/json' \
        -d "{
          \"text\": \"${STATUS}\",
          \"attachments\": [{
            \"color\": \"${COLOR}\",
            \"fields\": [
              {\"title\": \"Project\", \"value\": \"${CI_PROJECT_NAME}\", \"short\": true},
              {\"title\": \"By\", \"value\": \"${GITLAB_USER_NAME}\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"${CI_COMMIT_SHORT_SHA}\", \"short\": true},
              {\"title\": \"Message\", \"value\": \"${CI_COMMIT_MESSAGE}\", \"short\": false},
              {\"title\": \"Approve staging\", \"value\": \"${CI_PIPELINE_URL}\", \"short\": false}
            ]
          }]
        }"
  needs:
    - job: "apply-dev"
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always



