image: ubuntu:22.04

variables:
  # Set AWS_ROLE_ARN in GitLab CI project settings to avoid hardcoding account IDs
  AWS_ROLE_ARN: "arn:aws:iam::940920597829:role/gitlab-ci-terraform"
  AWS_DEFAULT_REGION: "us-east-1"
  TERRAFORM_VERSION: "1.5.7"
  AWS_CLI_VERSION: "2.15.0"
  DEV_ACCOUNT_ID: "446598504905"
  STAGING_ACCOUNT_ID: "916292310732"
  DEV_STATE_BUCKET: "terraform-state-${DEV_ACCOUNT_ID}"
  STAGING_STATE_BUCKET: "terraform-state-${STAGING_ACCOUNT_ID}"
  STATE_LOCK_TABLE: "terraform-state-lock"

stages:
  - validate
  - test
  - plan-dev
  - apply-dev
  - notify-dev
  - plan-staging
  - apply-staging
  - notify-final


# Combined template — OIDC + install
# step 1 — request OIDC token from GitLab

.base: &base
   id_tokens:
      GITLAB_OIDC_TOKEN:
        aud: sts.amazonaws.com
   before_script:

     # step 2 — install AWS CLI with GPG signature verification
     - apt-get update -qq && apt-get install -y -qq curl unzip gnupg
     - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip" -o awscliv2.zip
     - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip.sig" -o awscliv2.zip.sig
     - gpg --keyserver hkps://keys.openpgp.org --recv-keys FB5DB77FD5C118B80511ADA8A6310ACC4672475C
     - gpg --verify awscliv2.zip.sig awscliv2.zip
     - unzip -q awscliv2.zip && ./aws/install

     # step 3 — install Terraform with SHA256 checksum verification
     - curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS" -o terraform_SHA256SUMS
     - curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o terraform.zip
     - grep "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" terraform_SHA256SUMS | sha256sum -c -
     - unzip -q terraform.zip && mv terraform /usr/local/bin/

     # step 4 — authenticate with AWS via OIDC
     - >
       export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
       $(aws sts assume-role-with-web-identity
       --role-arn ${AWS_ROLE_ARN}
       --role-session-name "gitlab-ci-${CI_JOB_ID}"
       --web-identity-token "${GITLAB_OIDC_TOKEN}"
       --duration-seconds 3600
       --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
       --output text))

validate:
  stage: validate
  <<: *base
  script:
    # check formatting
    - terraform fmt --check -recursive

    # check syntax for dev
    - cd environments/dev
    - terraform init -backend=false
    - terraform validate

    # check syntax for staging
    - cd ${CI_PROJECT_DIR}/environments/staging
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

test:
  stage: test
  <<: *base
  script:
    # install tflint
    - curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
    - tflint --init --config $(pwd)/.tflint.hcl

    # run tflint on terraform directories
    - tflint --chdir=environments/dev --config $(pwd)/.tflint.hcl
    - tflint --chdir=environments/staging --config $(pwd)/.tflint.hcl
    - tflint --chdir=modules/vpc --config $(pwd)/.tflint.hcl
    - tflint --chdir=modules/ec2 --config $(pwd)/.tflint.hcl
    - tflint --chdir=modules/s3 --config $(pwd)/.tflint.hcl
    - tflint --chdir=bootstrap --config $(pwd)/.tflint.hcl

    # install and run checkov
    - apt-get install -y -qq python3-pip
    - pip3 install checkov
    - checkov -d environments/ --quiet
    - checkov -d modules/ --quiet
    - checkov -d bootstrap/ --quiet
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

plan-dev:
  stage: plan-dev
  <<: *base
  script:
    - cd environments/dev
    - terraform init
        -backend-config="bucket=${DEV_STATE_BUCKET}"
        -backend-config="dynamodb_table=${STATE_LOCK_TABLE}"
        -backend-config="region=${AWS_DEFAULT_REGION}"
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - environments/dev/tfplan
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - environments/dev/**/*
        - modules/**/*
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - environments/dev/**/*
        - modules/**/*

apply-dev:
  stage: apply-dev
  <<: *base
  script:
    - cd environments/dev
    - terraform init
        -backend-config="bucket=${DEV_STATE_BUCKET}"
        -backend-config="dynamodb_table=${STATE_LOCK_TABLE}"
        -backend-config="region=${AWS_DEFAULT_REGION}"
    - terraform apply tfplan
  needs: ["plan-dev"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - environments/dev/**/*
        - modules/**/*
        - .gitlab-ci.yml
      when: on_success


notify-dev:
  stage: notify-dev
  image: curlimages/curl:latest
  before_script: []
  script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        STATUS="❌ Dev deployment failed"
        COLOR="danger"
      else
        STATUS="✅ Dev deployed successfully"
        COLOR="good"
      fi
      curl -s -X POST $SLACK_WEBHOOK_URL \
        -H 'Content-type: application/json' \
        -d "{
          \"text\": \"${STATUS}\",
          \"attachments\": [{
            \"color\": \"${COLOR}\",
            \"fields\": [
              {\"title\": \"Project\", \"value\": \"${CI_PROJECT_NAME}\", \"short\": true},
              {\"title\": \"By\", \"value\": \"${GITLAB_USER_NAME}\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"${CI_COMMIT_SHORT_SHA}\", \"short\": true},
              {\"title\": \"Message\", \"value\": \"${CI_COMMIT_MESSAGE}\", \"short\": false},
              {\"title\": \"Approve staging\", \"value\": \"${CI_PIPELINE_URL}\", \"short\": false}
            ]
          }]
        }"
  needs: ["apply-dev"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always


plan-staging:
  stage: plan-staging
  <<: *base
  needs: ["notify-dev"]
  script:
    - cd environments/staging
    - terraform init
        -backend-config="bucket=${STAGING_STATE_BUCKET}"
        -backend-config="dynamodb_table=${STATE_LOCK_TABLE}"
        -backend-config="region=${AWS_DEFAULT_REGION}"
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - environments/staging/tfplan
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - environments/staging/**/*
        - modules/**/*
        - .gitlab-ci.yml


apply-staging:
  stage: apply-staging
  <<: *base
  script:
    - cd environments/staging
    - terraform init
        -backend-config="bucket=${STAGING_STATE_BUCKET}"
        -backend-config="dynamodb_table=${STATE_LOCK_TABLE}"
        -backend-config="region=${AWS_DEFAULT_REGION}"
    - terraform apply tfplan
  needs: ["plan-staging"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - environments/staging/**/*
        - modules/**/*
        - .gitlab-ci.yml
      when: manual

notify-final:
  stage: notify-final
  image: curlimages/curl:latest
  before_script: []
  script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
         STATUS="❌ Pipeline failed"
         COLOR="danger"
      else
        STATUS="✅ Pipeline succeeded"
        COLOR="good"
      fi
      curl -s -X POST $SLACK_WEBHOOK_URL \
        -H 'Content-type: application/json' \
        -d "{
          \"text\": \"${STATUS}\",
          \"attachments\": [{
            \"color\": \"${COLOR}\",
            \"fields\": [
              {\"title\": \"Project\", \"value\": \"${CI_PROJECT_NAME}\", \"short\": true},
              {\"title\": \"By\", \"value\": \"${GITLAB_USER_NAME}\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"${CI_COMMIT_SHORT_SHA}\", \"short\": true},
              {\"title\": \"Message\", \"value\": \"${CI_COMMIT_MESSAGE}\", \"short\": false},
              {\"title\": \"Approve staging\", \"value\": \"${CI_PIPELINE_URL}\", \"short\": false}
            ]
          }]
        }"
  needs: ["apply-staging"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
